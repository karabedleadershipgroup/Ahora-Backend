<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHORA — Karabed Leadership Group</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy:#1B2A4A; --navy-light:#243558; --navy-deep:#15213B;
    --gold:#C9A84C; --gold-light:#DEC06E;
    --gold-pale:rgba(201,168,76,.12); --gold-border:rgba(201,168,76,.3);
    --white:#fff; --w90:rgba(255,255,255,.9); --w60:rgba(255,255,255,.6);
    --w30:rgba(255,255,255,.3); --w15:rgba(255,255,255,.13); --w10:rgba(255,255,255,.08);
    --good:#7FB069; --soso:#D9B44A; --bad:#C96B6B;
  }
  html, body { height:100%; background:var(--navy); color:var(--white);
    font-family:'Montserrat',sans-serif; font-size:15px; line-height:1.6; }
  body { background:
    radial-gradient(1000px 500px at 80% -10%, rgba(201,168,76,.07), transparent 60%),
    radial-gradient(800px 600px at -10% 100%, rgba(126,140,255,.05), transparent 55%),
    var(--navy); }
  .shell { display:flex; flex-direction:column; height:100vh; height:100dvh; max-width:560px; margin:0 auto; }

  /* HEADER */
  .header { padding:12px 18px; border-bottom:.5px solid var(--w15); display:flex; align-items:center;
    justify-content:space-between; flex-shrink:0; gap:10px; }
  .logo-block { display:flex; align-items:center; gap:10px; min-width:0; }
  .klg-logo { height:38px; width:auto; border-radius:6px; flex-shrink:0; }
  .logo-text { display:flex; flex-direction:column; line-height:1.15; min-width:0; }
  .logo-top { font-size:13px; font-weight:600; letter-spacing:.12em; color:var(--gold); text-transform:uppercase; }
  .logo-bottom { font-family:'Cormorant Garamond',serif; font-size:10.5px; letter-spacing:.16em; color:var(--w60); text-transform:uppercase; white-space:nowrap; }
  .hdr-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .home-btn { background:none; border:.5px solid var(--w15); color:var(--w60); border-radius:99px;
    font-family:'Montserrat',sans-serif; font-size:10.5px; font-weight:500; letter-spacing:.05em;
    padding:5px 12px; cursor:pointer; display:none; }
  .home-btn:hover { border-color:var(--gold-border); color:var(--gold); }
  .lang-toggle { display:flex; border:.5px solid var(--gold-border); border-radius:99px; overflow:hidden; }
  .lang-toggle button { background:none; border:none; color:var(--w60); font-family:'Montserrat',sans-serif;
    font-size:10.5px; font-weight:600; letter-spacing:.06em; padding:5px 11px; cursor:pointer; }
  .lang-toggle button.on { background:var(--gold); color:var(--navy); }

  .save-row { display:flex; gap:8px; margin-top:12px; }
  .save-btn { flex:1; background:none; border:.5px solid var(--gold-border); color:var(--gold); border-radius:99px;
    font-family:'Montserrat',sans-serif; font-size:11.5px; font-weight:600; letter-spacing:.04em;
    padding:9px 12px; cursor:pointer; }
  .save-btn:hover { background:var(--gold-pale); }
  .screen { display:none; flex:1; flex-direction:column; overflow:hidden; }
  .screen.on { display:flex; }
  .scrollable { overflow-y:auto; }
  .scrollable::-webkit-scrollbar { width:3px; }
  .scrollable::-webkit-scrollbar-thumb { background:var(--w15); border-radius:99px; }

  /* GATE */
  .gate { align-items:center; justify-content:center; padding:32px 28px; text-align:center; }
  .gate-leaf { width:64px; height:64px; margin-bottom:18px; }
  .gate h1 { font-size:26px; font-weight:600; letter-spacing:.18em; color:var(--gold); }
  .gate .sub { font-family:'Cormorant Garamond',serif; font-size:16px; font-style:italic; color:var(--w60); margin:6px 0 30px; }
  .gate-input { width:100%; max-width:280px; background:var(--navy-light); border:.5px solid var(--w15);
    border-radius:99px; padding:13px 20px; font-family:'Montserrat',sans-serif; font-size:14px;
    letter-spacing:.1em; color:var(--white); text-align:center; outline:none; }
  .gate-input:focus { border-color:var(--gold-border); }
  .gate-err { font-size:11.5px; color:var(--bad); margin-top:10px; min-height:16px; }
  .gold-btn { background:linear-gradient(135deg,var(--gold),var(--gold-light)); color:var(--navy);
    border:none; border-radius:99px; padding:13px 38px; font-family:'Montserrat',sans-serif;
    font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; cursor:pointer;
    margin-top:16px; box-shadow:0 4px 18px rgba(201,168,76,.25); transition:transform .12s; }
  .gold-btn:hover { transform:translateY(-1px); }
  .gold-btn:disabled { background:var(--w15); color:var(--w30); box-shadow:none; cursor:default; }
  .gate-foot { font-size:10px; color:var(--w30); margin-top:34px; letter-spacing:.05em; }

  /* TERMS */
  .terms-wrap { flex:1; display:flex; flex-direction:column; padding:22px 22px 18px; overflow:hidden; }
  .terms-title { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:600; color:var(--gold); margin-bottom:4px; }
  .terms-sub { font-size:11px; color:var(--w60); margin-bottom:14px; }
  .terms-box { flex:1; overflow-y:auto; background:var(--navy-light); border:.5px solid var(--w15);
    border-radius:14px; padding:18px; font-size:12.5px; line-height:1.7; color:var(--w90); }
  .terms-box h3 { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin:16px 0 5px; }
  .terms-box h3:first-child { margin-top:0; }
  .terms-box p { margin-bottom:6px; }
  .agree-row { padding-top:16px; text-align:center; }
  .agree-row .gold-btn { margin-top:0; width:100%; }
  .decline-note { font-size:10.5px; color:var(--w30); margin-top:10px; }

  /* HOME */
  .hero { position:relative; flex-shrink:0; height:170px; overflow:hidden; }
  .hero img { width:100%; height:100%; object-fit:cover; display:block; opacity:.85; }
  .hero .hero-grad { position:absolute; inset:0; background:linear-gradient(to top, var(--navy) 6%, rgba(27,42,74,.55) 55%, rgba(27,42,74,.25)); }
  .hero-text { position:absolute; left:22px; right:22px; bottom:14px; }
  .hero-eyebrow { font-size:9.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-light); }
  .hero-title { font-family:'Cormorant Garamond',serif; font-size:27px; font-weight:600; line-height:1.15; }
  .hero-sub { font-size:11.5px; color:var(--w60); margin-top:2px; }
  .home-body { flex:1; overflow-y:auto; padding:16px 22px 28px; }
  .conf-note { font-size:11px; line-height:1.6; color:var(--w60); background:var(--gold-pale);
    border:.5px solid var(--gold-border); border-radius:12px; padding:11px 14px; margin-bottom:16px; }
  .picker-head { font-family:'Cormorant Garamond',serif; font-size:18px; font-weight:600; color:var(--w90); margin-bottom:10px; }
  .mode-card { display:flex; gap:13px; align-items:center; width:100%; text-align:left;
    background:var(--navy-light); border:.5px solid var(--w15); border-radius:14px;
    padding:14px 15px; margin-bottom:10px; cursor:pointer; transition:border-color .15s, transform .12s;
    font-family:'Montserrat',sans-serif; color:var(--white); }
  .mode-card:hover { border-color:var(--gold-border); transform:translateY(-1px); }
  .mode-icon { width:42px; height:42px; border-radius:12px; background:var(--gold-pale);
    border:.5px solid var(--gold-border); display:flex; align-items:center; justify-content:center;
    font-size:18px; flex-shrink:0; color:var(--gold); }
  .mode-name { font-family:'Cormorant Garamond',serif; font-size:17.5px; font-weight:600; color:var(--gold-light); line-height:1.2; }
  .mode-desc { font-size:11.5px; color:var(--w60); line-height:1.5; margin-top:2px; }
  .home-foot { font-size:9.5px; color:var(--w30); text-align:center; margin-top:14px; line-height:1.6; }

  /* MODE BANNER */
  .mode-banner { position:relative; flex-shrink:0; height:86px; overflow:hidden; }
  .mode-banner img { width:100%; height:100%; object-fit:cover; opacity:.7; display:block; }
  .mode-banner .hero-grad { position:absolute; inset:0; background:linear-gradient(to top, var(--navy) 8%, rgba(27,42,74,.6)); }
  .mode-banner .hero-text { bottom:10px; }
  .mode-banner .hero-title { font-size:20px; }

  /* PROGRESS */
  .progress-wrap { padding:10px 20px 4px; flex-shrink:0; }
  .pips { display:flex; gap:4px; }
  .pip { height:2px; flex:1; border-radius:99px; background:var(--w15); transition:background .35s; }
  .pip.active { background:var(--gold); }
  .pip.done { background:var(--gold-light); opacity:.7; }
  .step-label { font-size:10px; color:var(--w30); letter-spacing:.07em; text-transform:uppercase; margin-top:5px; min-height:14px; font-weight:500; }

  /* CHAT */
  .messages { flex:1; overflow-y:auto; padding:14px 20px 8px; display:flex; flex-direction:column; gap:10px; }
  .msg { display:flex; gap:10px; animation:fadeUp .2s ease both; }
  .msg.user { flex-direction:row-reverse; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
  .av { width:28px; height:28px; border-radius:50%; background:var(--gold-pale); border:.5px solid var(--gold-border);
    font-size:9px; font-weight:600; color:var(--gold); display:flex; align-items:center; justify-content:center;
    flex-shrink:0; margin-top:2px; }
  .msg.user .av { background:var(--w10); border-color:var(--w15); color:var(--w60); font-size:12px; }
  .bubble { max-width:84%; padding:10px 14px; border-radius:16px; font-size:13.5px; line-height:1.75; white-space:pre-wrap; }
  .msg.ai .bubble { background:var(--navy-light); border:.5px solid var(--w15); border-bottom-left-radius:4px;
    color:var(--w90); box-shadow:0 3px 14px rgba(0,0,0,.18); }
  .msg.user .bubble { background:var(--gold); color:var(--navy); border-bottom-right-radius:4px; font-weight:500; }
  .step-badge { display:inline-block; font-size:9px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
    background:var(--gold-pale); color:var(--gold); border:.5px solid var(--gold-border);
    padding:2px 8px; border-radius:99px; margin-bottom:7px; white-space:normal; }
  .typing { display:flex; gap:10px; }
  .t-dots { background:var(--navy-light); border:.5px solid var(--w15); padding:11px 14px; border-radius:16px;
    border-bottom-left-radius:4px; display:flex; gap:5px; align-items:center; }
  .dot { width:5px; height:5px; border-radius:50%; background:var(--gold); animation:bop 1.2s infinite; opacity:.6; }
  .dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
  @keyframes bop { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-4px);opacity:1} }

  /* CHOICE CHIPS (triage etc.) */
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:0 20px 6px 58px; }
  .chip { background:var(--gold-pale); border:.5px solid var(--gold-border); color:var(--gold-light);
    border-radius:99px; padding:8px 16px; font-family:'Montserrat',sans-serif; font-size:12px; font-weight:500;
    cursor:pointer; transition:background .15s; }
  .chip:hover { background:rgba(201,168,76,.22); }

  /* SCRIPT PANEL */
  .script-panel { flex-shrink:0; margin:0 20px 8px; background:var(--navy-deep); border:.5px solid var(--gold-border);
    border-left:3px solid var(--gold); border-radius:12px; overflow:hidden; display:none; }
  .script-panel.show { display:block; }
  .script-head { display:flex; justify-content:space-between; align-items:center; padding:9px 14px; cursor:pointer; }
  .script-head .lbl { font-size:9.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); }
  .script-head .count { font-size:9.5px; color:var(--w30); }
  .script-body { padding:0 14px 11px; font-family:'Cormorant Garamond',serif; font-size:15px; font-style:italic;
    line-height:1.7; color:var(--w90); display:none; }
  .script-panel.open .script-body { display:block; }

  /* INPUT */
  .input-area { padding:10px 16px 18px; border-top:.5px solid var(--w15); flex-shrink:0; }
  .input-row { display:flex; gap:8px; align-items:flex-end; }
  textarea.ibox { flex:1; background:var(--navy-light); border:.5px solid var(--w15); border-radius:20px;
    padding:11px 16px; font-family:'Montserrat',sans-serif; font-size:13px; color:var(--white);
    resize:none; outline:none; min-height:46px; max-height:120px; line-height:1.5; transition:border-color .15s; }
  textarea.ibox::placeholder { color:var(--w30); }
  textarea.ibox:focus { border-color:var(--gold-border); }
  .send-btn { width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,var(--gold),var(--gold-light));
    border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:transform .1s; box-shadow:0 3px 12px rgba(201,168,76,.3); }
  .send-btn:active { transform:scale(.93); }
  .send-btn:disabled { background:var(--w15); box-shadow:none; cursor:default; }
  .quote-line { font-family:'Cormorant Garamond',serif; font-size:12px; font-style:italic; color:var(--w30);
    text-align:center; padding-top:8px; }

  /* SCRIPT / SUMMARY / HARD STOP CARDS */
  .script-card { background:var(--navy-light); border:.5px solid var(--gold-border); border-left:3px solid var(--gold);
    border-radius:12px; padding:14px 16px; max-width:88%; font-size:13.5px; }
  .script-lbl { font-size:9px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--gold); margin-bottom:8px; }
  .script-lines { font-family:'Cormorant Garamond',serif; font-size:16px; font-style:italic; color:var(--w90); line-height:1.8; margin-bottom:8px; }
  .script-tip { font-size:11.5px; color:var(--w60); line-height:1.5; }
  .hardstop-card { background:rgba(201,107,107,.08); border:.5px solid rgba(201,107,107,.35); border-left:3px solid var(--bad);
    border-radius:12px; padding:14px 16px; max-width:88%; font-size:13px; line-height:1.7; color:var(--w90); }
  .restart-btn { width:100%; margin-top:12px; padding:10px; border-radius:99px; border:.5px solid var(--gold-border);
    background:transparent; color:var(--gold); font-family:'Montserrat',sans-serif; font-size:12px; font-weight:500;
    letter-spacing:.05em; cursor:pointer; }
  .restart-btn:hover { background:var(--gold-pale); }

  /* ASK ISA */
  .ask-body { flex:1; overflow-y:auto; padding:18px 22px 24px; }
  .ask-intro { font-size:12.5px; color:var(--w60); line-height:1.7; margin-bottom:14px; }
  textarea.ask-box { width:100%; background:var(--navy-light); border:.5px solid var(--w15); border-radius:14px;
    padding:14px 16px; font-family:'Montserrat',sans-serif; font-size:13.5px; color:var(--white);
    resize:none; outline:none; min-height:110px; line-height:1.6; }
  textarea.ask-box:focus { border-color:var(--gold-border); }
  .ask-answer { margin-top:16px; background:var(--navy-light); border:.5px solid var(--gold-border);
    border-left:3px solid var(--gold); border-radius:14px; padding:16px; display:none; }
  .ask-answer.show { display:block; animation:fadeUp .25s ease both; }
  .ask-answer .who { font-family:'Cormorant Garamond',serif; font-size:16px; font-weight:600; color:var(--gold); margin-bottom:7px; }
  .ask-answer .txt { font-size:13.5px; line-height:1.8; color:var(--w90); white-space:pre-wrap; }
  .ask-loading { margin-top:16px; display:none; }
  .ask-loading.show { display:flex; }

  /* FLASHCARDS (Value Spotter) & PRACTICE */
  .card-body { flex:1; overflow-y:auto; padding:18px 22px 26px; }
  .fc-counter { font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--w30); margin-bottom:10px; }
  .fc-sit { font-family:'Cormorant Garamond',serif; font-size:19px; line-height:1.5; color:var(--w90); margin-bottom:8px; }
  .fc-q { font-size:12px; font-weight:600; color:var(--gold); margin:10px 0 14px; letter-spacing:.02em; }
  .fc-opt { display:block; width:100%; text-align:left; background:var(--navy-light); border:.5px solid var(--w15);
    border-radius:13px; padding:13px 15px; margin-bottom:10px; cursor:pointer; color:var(--w90);
    font-family:'Montserrat',sans-serif; font-size:13px; line-height:1.6; transition:border-color .15s; }
  .fc-opt:hover:not(:disabled) { border-color:var(--gold-border); }
  .fc-opt.good { border-color:var(--good); background:rgba(127,176,105,.1); }
  .fc-opt.soso { border-color:var(--soso); background:rgba(217,180,74,.08); }
  .fc-opt.bad  { border-color:var(--bad); background:rgba(201,107,107,.08); }
  .fc-fb { font-size:11.5px; line-height:1.6; margin-top:8px; padding-top:8px; border-top:.5px dashed var(--w15); color:var(--w60); display:none; }
  .fc-opt.good .fc-fb, .fc-opt.soso .fc-fb, .fc-opt.bad .fc-fb { display:block; }
  .fc-next { margin-top:6px; width:100%; }
  .fc-done { text-align:center; padding:30px 10px; }
  .fc-done .big { font-family:'Cormorant Garamond',serif; font-size:24px; color:var(--gold); margin-bottom:10px; }
  .fc-done p { font-size:13px; color:var(--w60); line-height:1.7; }

  /* PRACTICE */
  .pr-scen { display:block; width:100%; text-align:left; background:var(--navy-light); border:.5px solid var(--w15);
    border-radius:14px; padding:14px 15px; margin-bottom:10px; cursor:pointer; color:var(--white);
    font-family:'Montserrat',sans-serif; transition:border-color .15s; }
  .pr-scen:hover { border-color:var(--gold-border); }
  .pr-scen .t { font-family:'Cormorant Garamond',serif; font-size:17px; font-weight:600; color:var(--gold-light); }
  .pr-scen .r { display:inline-block; font-size:9px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    background:var(--gold-pale); border:.5px solid var(--gold-border); color:var(--gold);
    border-radius:99px; padding:2px 8px; margin-left:6px; vertical-align:2px; }
  .pr-scen .d { font-size:11.5px; color:var(--w60); margin-top:3px; line-height:1.55; }
  .pr-sit { background:var(--navy-deep); border:.5px solid var(--w15); border-radius:13px; padding:13px 15px;
    font-family:'Cormorant Garamond',serif; font-size:16.5px; line-height:1.6; color:var(--w90); margin-bottom:14px; }
  .pr-step-lbl { font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); margin-bottom:5px; }
  .pr-q { font-size:13.5px; font-weight:500; color:var(--w90); line-height:1.6; margin-bottom:10px; }
  textarea.pr-box { width:100%; background:var(--navy-light); border:.5px solid var(--w15); border-radius:13px;
    padding:12px 15px; font-family:'Montserrat',sans-serif; font-size:13px; color:var(--white);
    resize:none; outline:none; min-height:84px; line-height:1.6; }
  textarea.pr-box:focus { border-color:var(--gold-border); }
  .pr-btns { display:flex; gap:8px; margin-top:10px; }
  .pr-btns .gold-btn { margin-top:0; flex:1; padding:11px 10px; font-size:11px; }
  .ghost-btn { flex:1; background:transparent; border:.5px solid var(--gold-border); color:var(--gold);
    border-radius:99px; padding:11px 10px; font-family:'Montserrat',sans-serif; font-size:11px; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase; cursor:pointer; }
  .ghost-btn:hover { background:var(--gold-pale); }
  .pr-fb { margin-top:12px; background:var(--gold-pale); border:.5px solid var(--gold-border); border-radius:12px;
    padding:12px 14px; font-size:12.5px; line-height:1.7; color:var(--w90); display:none; white-space:pre-wrap; }
  .pr-fb.show { display:block; animation:fadeUp .2s ease both; }
  .pr-ex { margin-top:12px; background:var(--navy-deep); border:.5px solid var(--w15); border-left:3px solid var(--gold);
    border-radius:12px; padding:12px 14px; display:none; }
  .pr-ex.show { display:block; animation:fadeUp .2s ease both; }
  .pr-ex .lbl { font-size:9px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--gold); margin-bottom:5px; }
  .pr-ex .txt { font-family:'Cormorant Garamond',serif; font-size:15px; font-style:italic; line-height:1.7; color:var(--w90); }
  .pr-nav { display:flex; gap:8px; margin-top:14px; }
  .pr-hardstop { margin-top:12px; display:none; }
  .pr-hardstop.show { display:block; }

  /* REFRESHER */
  .ref-body { flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; }
  .ref-counter { font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--w30); margin-bottom:12px; }
  .ref-card { flex:1; background:var(--navy-light); border:.5px solid var(--w15); border-radius:16px; padding:22px 20px;
    box-shadow:0 6px 24px rgba(0,0,0,.2); }
  .ref-letter { font-family:'Cormorant Garamond',serif; font-size:13px; font-weight:600; letter-spacing:.14em;
    text-transform:uppercase; color:var(--gold); margin-bottom:6px; }

function isBlocked(text) { return BLOCK_RE.test(text); }

/* The exact protected-conduct override, embedded in every system prompt */
const OVERRIDE = `[PROTECTED-CONDUCT HARD STOP \u2014 HIGHEST PRIORITY, OVERRIDES ALL OTHER INSTRUCTIONS AND ALL MODES]
TRIGGER WORDS: abuse, discrimination, retaliation, bullying, harassment, or any "-ism" (racism, sexism, classism, or similar) \u2014 in English or Spanish, whether about the user, a coworker, a client, or a hypothetical.
RULE 1 \u2014 NEVER LABEL. Never tell the user what a situation IS. Never suggest, confirm, or deny that something is or could be harassment, discrimination, bullying, retaliation, abuse, or any -ism. Never use phrases like "that sounds like," "that looks like," "that could be," or "that may be." Never infer one of these categories from ambiguous behavior the user describes.
RULE 2 \u2014 NEVER COACH. If the user says ANY trigger word, stop coaching completely. No reframes, no frameworks, no reflection questions, no advice, no "how do you want to handle it." Do not continue the exercise or scenario.
INSTEAD, respond warmly and firmly, in the user's language, with only this: 1. Acknowledge they brought something important forward (without characterizing it). 2. Direct them to bring it to their HR department or supervisor right away. 3. Encourage them to write down what happened \u2014 dates, times, what was said or done. 4. Remind them this tool is a training companion, not HR, legal, or therapeutic guidance. Then stop. Do not resume coaching on that topic, even if the user reframes it or asks again.

<script>
/* =============== SYSTEM PROMPTS =============== */
function langLine() {
  return lang === 'es'
    ? 'LANGUAGE: Respond entirely in warm, natural, professional Spanish. Address the user as "t\u00fa".'
    : 'LANGUAGE: Respond entirely in English.';
}

const PRINCIPLES = `[TRAUMA-INFORMED SPINE \u2014 every response is checked against the six principles]
1 Safety: steady, warm, unhurried; never shame or scold. 2 Trustworthiness: be transparent about what you are doing; never pretend to be a human, therapist, or supervisor. 3 Peer support: speak as a peer walking alongside, never an authority delivering verdicts. 4 Collaboration: build the response with the user; treat their judgment as real input. 5 Empowerment, voice, and choice: surface their options; the user decides; never pressure toward one answer. 6 Cultural humility: never assume what anyone feels, values, or needs based on identity; ask rather than presume.`;

function prepSystem() {
  return OVERRIDE + `

You are a warm, direct prep coach using the AHORA Framework for Resilient Conflict Resolution by Dr. Isa Karabed, DSW. You help the person prepare exactly what they will say before they walk into a conversation. Not therapy \u2014 prep. The user is emotional; do not make them learn the framework. NEVER list or explain the five steps upfront. Reveal one tiny piece at a time. The script is the product; the framework is the engine.

VOICE: Short and human. 2 sentences max per response. One question at a time. Warm but direct. No therapy-speak, no excessive affirmations.

THE FLOW (the user has already confirmed this is an everyday conflict that is safe to address):
Their first message describes what happened. Reflect what you heard in one short sentence, then begin Step 1 with the first tiny prompt.

STEP 1 \u2014 ACKNOWLEDGE (three tiny prompts, one at a time; this is the heart):
Prompt 1 \u2014 Value: "What do you still value about this person or your relationship with them?" Help them shape their answer into ONE honest, specific sentence they will say out loud. YOU build the sentence for them from their words and ask if it sounds like them. Do not move on until it feels honest and specific. Then attach the bridge \u2014 this is the foundation of AHORA: the value sentence must flow directly into \u201cFor that reason, I want to share something that happened that made me feel [upset / confused / not valued \u2014 their honest word].\u201d Build value + bridge as ONE opening and [SAVE] them together as one line.
Prompt 2 \u2014 What happened: "What did they do?" One sentence, just the behavior, no judgments.
Prompt 3 \u2014 Impact: "What impact did it have on you?" One real sentence.
After each part is confirmed, output the finished sentence wrapped exactly like this on its own line: [SAVE]the sentence[/SAVE] \u2014 then continue. The [SAVE] line is captured by the interface as their growing script; do not repeat the sentence again in prose after saving it.

STEP 2 \u2014 PAUSE AND NOTICE (this is what we call this step to the user; never say "Hold accountability"):
Tell them: say your opening, then stop and wait, and watch what the other person does. If they take accountability, skip ahead to the final agreement. Ask: "What do you think they will do when you say this?" Help them plan one calm sentence for the defensive case. [SAVE] their plan.

STEP 3 \u2014 OPEN POSSIBILITIES: This is not necessarily a question. It is a sentence that paints what repair could make possible and hands the other person the choice to accept it or not (e.g. "I think it would be great for our relationship if we resolve this. What do you think?"). They open the door; the other person chooses to walk through it. Help them craft their own version. [SAVE] it.

STEP 4 \u2014 REQUEST REPAIR: "What exactly do you need them to do differently?" One behavioral request: "Going forward I need you to [specific action]." [SAVE] it.

STEP 5 \u2014 ACT AND ALIGN: Always, even after an apology. One closing agreement line: "So we are agreeing that going forward we will [action]. Does that work?" [SAVE] it.

COACHING WISDOM FROM DR. ISA'S LIVE CLASS (apply throughout):
- The impact must be the user's OWN real impact (\u201cmy time,\u201d \u201cI felt unheard\u201d) \u2014 never an assumed impact on someone else. If they say \u201cthe client lost trust,\u201d gently ask: did the client say that, or is that the story in your head? Keep only what's real.
- \u201cThey should know better\u201d is a story, not a fact \u2014 no one is a mind reader, and most coworkers are not intentionally trying to hurt us. Help the user soften hardened stories back into questions.
- If your goal is to be right, AHORA is not the tool; if your goal is repair, it is. If the user sounds like they want to win, name it kindly and re-anchor on repair.
- The majority of conflicts resolve with just the Acknowledge opening and the Pause. Tell the user this when planning the pause \u2014 it lowers the stakes. The remaining steps exist to seal the deal if the person gets defensive, and once defensive, people often stay defensive \u2014 the user is giving chance after chance and staying in integrity.
- If after everything there is no repair: escalate, don't retreat. Help them plan the integrity sentence for their manager: \u201cI shared their value, what happened, how it impacted me, and asked for repair \u2014 they didn't want it. I need help.\u201d
- ALWAYS finish with Act and Align even when repair comes early \u2014 naming the future behavior may sound obvious, but people are often genuinely unaware (a chronic interrupter is rarely told). Naming it seals the deal.
- Done well, all five steps can take under 30 seconds. Keep their script that tight.

MARKERS:
- When you move to a new step, begin your message with [STEP:X] where X is 1-5. Do not name the step in prose; the interface shows it.
- When all steps are complete, output [STEP:DONE] then on new lines, one per step, "A \u2014 Acknowledge: ..." / "H \u2014 Pause and Notice: ..." / "O \u2014 Open possibilities: ..." / "R \u2014 Request repair: ..." / "A \u2014 Act and align: ..." each with a one-sentence summary, then:
SCRIPT:
"[Their full prepared sentences in order, ready to say out loud]"
One line of delivery coaching \u2014 calm tone, then stop and listen.

` + PRINCIPLES + `

` + langLine();
}

function askSystem() {
  return OVERRIDE + `

You are the Ask Dr. Isa feature of the AHORA training companion by Dr. Isa Karabed, DSW. This is NOT a dialogue. The user asks one question; you give ONE answer and nothing else \u2014 never ask a question back, never invite follow-up, never end with an offer to continue.

Your single answer is either:
(a) one practical suggestion (3-5 sentences) grounded strictly in the AHORA training \u2014 warm, direct, plain language in Dr. Isa's voice; or
(b) if the protected-conduct hard stop is triggered, the redirect described above, and nothing else.

THE AHORA TRAINING (your only knowledge base):
AHORA (\u201cnow\u201d in Spanish) is a bilingual, trauma-informed framework to INITIATE repair at the workplace, created by Dr. Isa Karabed, DSW through her doctoral research \u2014 she built it because she could not find a conflict resolution framework that was culturally appropriate and started with the value of the person. It was born from real coaching: the most common thing leaders bring is \u201cmy staff member did X and I don\u2019t know how to start the conversation \u2014 I want to be compassionate, supportive, AND keep them accountable.\u201d AHORA is the language for that. It centers grace, accountability, and action. It is a suggestion and a conversation guide, never a mandate; it is NOT an HR or legal process, not a safety intervention, and not a guarantee of repair \u2014 it fits everyday interpersonal workplace conflict that is not unsafe.

WHY IT MATTERS: 40% of US staff report high unresolved conflict and 30% report simmering tension \u2014 two real things living together at once. 18% of workers quit over unresolved conflict; lost productivity runs about $359 billion a year. Unresolved conflict follows a chain: silence \u2192 the story starts in the head (\u201cthey don\u2019t like me \u2014 I knew it when she didn\u2019t say hi\u201d) \u2192 resentment (\u201cI\u2019m not valued; they all go to lunch without me\u201d) \u2192 team damage, because a person carrying that story cannot show up psychologically safe, present, or creative.

CONFLICT STYLES (awareness, not labels): the Avoider (\u201cI won\u2019t stir the pot \u2014 nothing will change anyway\u201d \u2014 the most common style, and avoiders still sit with the feelings), the Volcano (everything must be addressed right now), the Lawyer (out to prove they\u2019re right), and the Repairer (\u201clet\u2019s talk, let\u2019s fix it\u201d). Most people are a mix depending on the situation. The style is just awareness \u2014 the key is HOW you carry out the resolution process.

TIMING \u2014 THE 48-HOUR GUIDELINE: 24 hours is usually too soon (still raw); 48 hours is the sweet spot the research points to; past 48\u201372 hours the stories in your head start to harden from assumption into \u201creality.\u201d But it always depends on the person and the relationship \u2014 the best time is when both people are ready, never rushed. If a deadline forces an immediate patch-up, still circle back within about 48 hours for a real retrospective (\u201cI know we rushed through that \u2014 are you okay? Let\u2019s talk about it\u201d).

THE TWO ROLES: the Impacted receives the harm. Only the impacted person knows the conflict exists \u2014 no one is a mind reader; \u201cthey should know better\u201d is a story, not a fact. Most coworkers are NOT intentionally trying to hurt you; they may be acting out of their own struggles, trauma, or precipitating factors, and the only way to know the truth is to talk to them. So the impacted assumes positive intent and acts anyway \u2014 repair requires someone to open the door. The Impactor causes the impact and owns it fully, no excuses, with humility, then commits to repair.

THE GOAL TEST: if your goal is to be RIGHT, AHORA is not the right tool. If your goal is REPAIR \u2014 ending with the relationship built rather than destroyed \u2014 this is the tool. Forced fixes don\u2019t count: putting two people in a room and saying \u201cfix it\u201d gets a \u201cyeah, sure, it\u2019s fine\u201d that isn\u2019t fine. The process is what makes resolution real.

THE GOOD NEWS: the majority of people who use AHORA resolve the conflict using only the first two steps \u2014 Acknowledge and the Pause. The other three steps exist to seal the deal and tighten it up for the small percentage of cases where the person gets defensive. All five steps can take under 30 seconds once practiced.

THE FIVE STEPS:
A \u2014 ACKNOWLEDGE two things, and this is the most-forgotten step (across 18 site trainings, staff most often skip the value \u2014 don\u2019t). First, the VALUE of the person or working relationship, said honestly and specifically. The strategic reason: opening with \u201cyou did X\u201d makes the other person defensive \u2014 their brain flips from thinking brain to emotional/survival brain and they stop hearing you completely (the CPI principle). Value first gives safety and signals \u201cI\u2019ve got your back; I\u2019m here to grow the relationship.\u201d Immediately follow the value with the bridge \u2014 the foundation of the whole resolution: \u201cFor that reason, I want to share something that happened that made me feel [upset, confused, not valued, unheard\u2026]\u201d \u2014 or as an ask: \u201cCan I share something that happened last week?\u201d Then say WHAT HAPPENED (just the behavior, one sentence, no judgments) and HOW IT IMPACTED YOU. The impact must be YOUR OWN real impact (\u201cmy time,\u201d \u201cmy trust,\u201d \u201cI felt unheard\u201d) \u2014 never an assumed impact on someone else (don\u2019t claim \u201cthe client lost trust\u201d unless the client actually said so).
H \u2014 PAUSE (user-facing: Pause and Notice; formally Hold accountability): say your opening, then STOP TALKING. Nerves make people say too much \u2014 the pause lets you listen, stay present, and let them respond. Two things can happen: bingo \u2014 they apologize or acknowledge it and you have resolution (the majority outcome) \u2014 or they get defensive. As the impactor, this step means holding YOURSELF accountable without deflection.
O \u2014 OPEN POSSIBILITIES: an invitation, not necessarily a question \u2014 paint what resolving could make possible and hand them the CHOICE: \u201cI think it would be really good for us and for our clients if we resolve this \u2014 what do you think?\u201d If they choose no, that is their own choosing; you planted a seed they may come back to after they\u2019ve sat with it.
R \u2014 REQUEST REPAIR: the more explicit version \u2014 name that resolution has to happen: \u201cWe can\u2019t be at work like this; it\u2019s in our values to be collaborative \u2014 that\u2019s why I\u2019m here. We\u2019ve got to resolve it.\u201d Know this: once someone is defensive, the likelihood they stay defensive is high \u2014 and that\u2019s okay. You are giving them chance after chance for repair and staying in integrity.
A \u2014 ACT AND ALIGN: ALWAYS close here, even after a quick apology at step one. Ask for the specific future behavior: \u201cGoing forward, if you\u2019re running late, can you please text me ahead of time?\u201d It may sound obvious but it is not \u2014 sometimes we have to name it (people are often genuinely unaware, like a chronic interrupter who was never told). Naming it seals the deal so it doesn\u2019t happen again.

IF THERE IS NO REPAIR: escalate, don\u2019t retreat. Go to your manager from integrity: \u201cI talked to them. I shared their value, what happened, and how it impacted me. I asked for repair, and they didn\u2019t want it. I tried my best \u2014 I need help.\u201d You did your best; you stayed in integrity; now you have information.

A HIDDEN GIFT: initiating repair often reveals what\u2019s really going on \u2014 you may learn your colleague is struggling (a sick kid, a missed pickup, a blocked process) and you can become their ally and advocate. They feel seen and supported; you learn something true about them. Saying yes to the conversation is saying yes to the relationship.

` + PRINCIPLES + `

` + langLine();
}

/* =============== API =============== */
const PROXY = '/api/chat';
const DIRECT = 'https://api.anthropic.com/v1/messages';
async function callAPI(system, messages) {
  /* Prompt caching: the big system prompt is marked cacheable, so repeat calls
     within 5 minutes count almost nothing against the input-token rate limit
     and cost ~90% less. Auto-retry: rate-limit or overload errors (429/529)
     get up to 3 quiet retries with backoff before the user ever sees an error. */
  const body = JSON.stringify({
    model:'claude-sonnet-4-20250514',
    max_tokens:1000,
    system:[{ type:'text', text:system, cache_control:{ type:'ephemeral' } }],
    messages
  });
  const opts = { method:'POST', headers:{'Content-Type':'application/json'}, body };
  const parse = async (res) => {
    const data = await res.json();
    return (data.content || []).filter(b => b.type === 'text' || b.text).map(b => b.text || '').join('');
  };
  for (let attempt = 0; attempt < 4; attempt++) {
    try {
      const res = await fetch(PROXY, opts);
      if (res.status === 429 || res.status === 529) throw new Error('busy ' + res.status);
      if (!res.ok) throw new Error('proxy ' + res.status);
      return await parse(res);
    } catch(e) {
      if (attempt < 3) await new Promise(r => setTimeout(r, 1500 * Math.pow(2, attempt)));
    }
  }
  /* Last resort (works when running inside Claude artifacts) */
  const res = await fetch(DIRECT, opts);
  return await parse(res);
}

function copyScript(btn, text) {
  const done = () => { const t = btn.textContent; btn.textContent = UI[lang].svCopied; setTimeout(() => { btn.textContent = t; }, 2000); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea'); ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); done(); } catch(e) {}
  document.body.removeChild(ta);
}
function downloadScript(filename, text) {
  const blob = new Blob([text], { type:'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

  c.textContent = u.xStepOf + ' ' + (prState.step+1) + ' / 6 \u00b7 ' + s.title[lang]; body.appendChild(c);
  const sit = document.createElement('div'); sit.className='pr-sit'; sit.textContent = s.sit[lang]; body.appendChild(sit);
  const lbl = document.createElement('div'); lbl.className='pr-step-lbl'; lbl.textContent = p.l; body.appendChild(lbl);
  const q = document.createElement('div'); q.className='pr-q'; q.textContent = p.q; body.appendChild(q);
  const box = document.createElement('textarea'); box.className='pr-box'; box.id='pr-box';
  box.value = prState.answers[prState.step] || '';
  box.placeholder = u.pPh; body.appendChild(box);
  const btns = document.createElement('div'); btns.className='pr-btns';
  const fbBtn = document.createElement('button'); fbBtn.className='gold-btn'; fbBtn.id='pr-fb-btn'; fbBtn.textContent = u.xCheck;
  fbBtn.onclick = prFeedback; btns.appendChild(fbBtn);
  const exBtn = document.createElement('button'); exBtn.className='ghost-btn'; exBtn.textContent = u.xShow;
  exBtn.onclick = () => { $('pr-ex').classList.add('show'); }; btns.appendChild(exBtn);
  body.appendChild(btns);
  const fb = document.createElement('div'); fb.className='pr-fb'; fb.id='pr-fb'; body.appendChild(fb);
  const ex = document.createElement('div'); ex.className='pr-ex'; ex.id='pr-ex';
  ex.innerHTML = '<div class="lbl">' + u.xExLbl + '</div><div class="txt">' + escapeHTML(s.ex[lang][prState.step]) + '</div>';
  body.appendChild(ex);
  const hs = document.createElement('div'); hs.className='pr-hardstop'; hs.id='pr-hs'; body.appendChild(hs);
  const nav = document.createElement('div'); nav.className='pr-nav';
  const back = document.createElement('button'); back.className='ghost-btn'; back.textContent = u.xBack;
  back.onclick = () => { prState = { scen:null }; renderPractice(); }; nav.appendChild(back);
  const nxt = document.createElement('button'); nxt.className='gold-btn'; nxt.id='pr-next'; nxt.style.marginTop='0';
  nxt.textContent = u.xNext;
  nxt.onclick = () => {
    if (prState.stopped) return;
    prState.answers[prState.step] = $('pr-box').value.trim();
    prState.step++; renderPractice(); $('practice-body').scrollTop = 0;
  };
  nav.appendChild(nxt); body.appendChild(nav);
}
async function prFeedback() {
  if (prState.busy || prState.stopped) return;
  const txt = $('pr-box').value.trim(); if (!txt) return;
  prState.answers[prState.step] = txt;
  if (isBlocked(txt)) {
    prState.stopped = true;
    const hs = $('pr-hs'); hs.classList.add('show');
    hs.innerHTML = '<div class="hardstop-card" style="max-width:100%">' + escapeHTML(HARDSTOP[lang]) + '</div>';
    $('pr-box').disabled = true; $('pr-fb-btn').disabled = true; $('pr-next').disabled = true;
    return;
  }
  prState.busy = true; $('pr-fb-btn').disabled = true;
  const fb = $('pr-fb'); fb.classList.add('show'); fb.textContent = '\u2026';
  try {
    const raw = await callAPI(feedbackSystem(prState.scen, prState.step), [{role:'user', content:txt}]);
    fb.textContent = raw.trim();
  } catch(e) { fb.textContent = UI[lang].err; }
  prState.busy = false; $('pr-fb-btn').disabled = false;
}
function renderPracticeDone() {
  const u = UI[lang], body = $('practice-body'), s = prState.scen;
  body.innerHTML = '';
  const c = document.createElement('div'); c.className='fc-counter'; c.textContent = s.title[lang]; body.appendChild(c);
  const card = document.createElement('div'); card.className='script-card'; card.style.maxWidth='100%';
  const linesArr = prState.answers.map((a,i) => a && a.length ? a : s.ex[lang][i].replace(/^\u201c|\u201d$/g,''));
  card.innerHTML = '<div class="script-lbl">' + u.xDoneBig + '</div>'
    + '<div class="script-lines">' + linesArr.map(l => '\u201c' + escapeHTML(l) + '\u201d').join('<br>') + '</div>'
    + '<div class="script-tip">' + u.xDoneTip + '</div>';
  addSaveRow(card, u.xDoneBig + ' \u2014 ' + s.title[lang], linesArr.map(l => '\u201c' + l + '\u201d').join('\n\n'), u.xDoneTip, lang==='es' ? 'mi-guion-ahora.txt' : 'my-ahora-script.txt');
  body.appendChild(card);
  const nav = document.createElement('div'); nav.className='pr-nav';
  const back = document.createElement('button'); back.className='gold-btn'; back.style.marginTop='0';
  back.textContent = u.xBack; back.onclick = () => { prState = { scen:null }; renderPractice(); };
  nav.appendChild(back); body.appendChild(nav);
}

const TRAINING = [
{ t:{en:'Welcome to AHORA', es:'Bienvenido(a) a AHORA'},
  b:{en:'AHORA means \u201cnow\u201d in Spanish. Dr. Isa Karabed, DSW created it through her doctoral research because she could not find a conflict resolution framework that was culturally appropriate and started with the value of the person. AHORA is a repair framework and a conversation guide \u2014 language for the moment you don\u2019t know what to say. It is a suggestion, never a mandate, and it is not an HR or legal process: if a situation feels unsafe or involves serious conduct, go to your supervisor or HR. One test before you use it: <b>if your goal is to be right, this is not the tool. If your goal is repair \u2014 ending with the relationship built rather than destroyed \u2014 it is.</b>',
     es:'AHORA significa eso: ahora. La Dra. Isa Karabed, DSW lo cre\u00f3 en su investigaci\u00f3n doctoral porque no encontr\u00f3 un marco de resoluci\u00f3n de conflictos que fuera culturalmente apropiado y que comenzara con el valor de la persona. AHORA es un marco de reparaci\u00f3n y una gu\u00eda de conversaci\u00f3n \u2014 lenguaje para el momento en que no sabes qu\u00e9 decir. Es una sugerencia, nunca una obligaci\u00f3n, y no es un proceso de RR.HH. ni legal: si una situaci\u00f3n se siente insegura o involucra conducta seria, acude a tu supervisor(a) o a RR.HH. Una prueba antes de usarlo: <b>si tu objetivo es tener la raz\u00f3n, esta no es la herramienta. Si tu objetivo es reparar \u2014 terminar con la relaci\u00f3n construida y no destruida \u2014 s\u00ed lo es.</b>'},
  q:{en:'What brings you to this training \u2014 and honestly, is your goal usually to be right, or to repair?',

{ t:{en:'Which conflict style are you?', es:'\u00bfCu\u00e1l es tu estilo de conflicto?'},
  b:{en:'The <b>Avoider</b>: \u201cI\u2019m not going to stir the pot \u2014 nothing will change anyway.\u201d The most common style \u2014 and avoiders still sit with the feelings. The <b>Volcano</b>: everything must be addressed right now, right now. The <b>Lawyer</b>: out to prove they\u2019re right and you\u2019re wrong. The <b>Repairer</b>: \u201clet\u2019s talk, let\u2019s fix it\u201d \u2014 yours and everyone else\u2019s conflicts. Most of us are a mix depending on the situation. The style is just awareness \u2014 <b>the key is how you carry out the process.</b>',
     es:'La <b>Evasora</b>: \u201cno voy a revolver las cosas \u2014 nada va a cambiar de todos modos.\u201d El estilo m\u00e1s com\u00fan \u2014 y quien evita igual se queda con los sentimientos. El <b>Volc\u00e1n</b>: todo debe resolverse ahora mismo. El <b>Abogado</b>: busca demostrar que tiene la raz\u00f3n y t\u00fa no. La <b>Reparadora</b>: \u201chablemos, arregl\u00e9moslo\u201d \u2014 tus conflictos y los de todos. La mayor\u00eda somos una mezcla seg\u00fan la situaci\u00f3n. El estilo es solo conciencia \u2014 <b>la clave es c\u00f3mo llevas a cabo el proceso.</b>'},
  q:{en:'Which style sounds most like you \u2014 and what does it look like when conflict shows up in your week?',
     es:'\u00bfCu\u00e1l estilo se parece m\u00e1s a ti \u2014 y c\u00f3mo se ve cuando aparece un conflicto en tu semana?'} },
{ t:{en:'The story in the head', es:'La historia en la cabeza'},
  b:{en:'40% of staff report high unresolved conflict, 30% report simmering tension \u2014 two real things living together \u2014 and 18% of workers quit over it. Here is how it grows: silence \u2192 the story starts in the head (\u201cthey don\u2019t like me \u2014 I knew it when she didn\u2019t say hi\u201d) \u2192 resentment (\u201cI\u2019m not valued; they all go to lunch without me\u201d) \u2192 team damage, because a person carrying that story can\u2019t show up safe, present, or creative. But remember: <b>no one is a mind reader.</b> \u201cThey should know better\u201d is a story, not a fact \u2014 and most coworkers are not intentionally trying to hurt you. The only way to know the truth is to talk to them.',
     es:'El 40% del personal reporta conflicto alto sin resolver, el 30% reporta tensi\u00f3n latente \u2014 dos cosas reales que viven juntas \u2014 y el 18% de los trabajadores renuncia por eso. As\u00ed crece: silencio \u2192 la historia empieza en la cabeza (\u201cno le caigo bien \u2014 lo supe cuando no me salud\u00f3\u201d) \u2192 resentimiento (\u201cno me valoran; todos van a almorzar sin m\u00ed\u201d) \u2192 da\u00f1o al equipo, porque quien carga esa historia no puede llegar segura, presente ni creativa. Pero recuerda: <b>nadie lee mentes.</b> \u201cDeber\u00edan saberlo\u201d es una historia, no un hecho \u2014 y la mayor\u00eda de tus colegas no intenta lastimarte. La \u00fanica forma de saber la verdad es hablar con la persona.'},
  q:{en:'Think of a story your head once wrote about a coworker. What did carrying it cost you?',

{ t:{en:'The 48-hour window', es:'La ventana de 48 horas'},
  b:{en:'24 hours is usually too soon \u2014 it still feels like it just happened. <b>48 hours is the sweet spot</b> the research points to. Past 48\u201372 hours, the stories in your head start to harden from assumption into \u201creality.\u201d But this is a guideline, never a rule: it depends on the person and the relationship, and the best time is when both people are ready \u2014 never rushed. And if a deadline forces you to patch something up fast, still circle back within about 48 hours: \u201cI know we rushed through that \u2014 are you okay? Let\u2019s talk about it.\u201d',
     es:'24 horas suele ser demasiado pronto \u2014 todav\u00eda se siente como si acabara de pasar. <b>48 horas es el punto ideal</b> que se\u00f1ala la investigaci\u00f3n. Despu\u00e9s de 48\u201372 horas, las historias en tu cabeza empiezan a endurecerse de suposici\u00f3n a \u201crealidad.\u201d Pero es una gu\u00eda, nunca una regla: depende de la persona y la relaci\u00f3n, y el mejor momento es cuando ambas personas est\u00e1n listas \u2014 nunca con prisa. Y si una fecha l\u00edmite te obliga a arreglar algo r\u00e1pido, vuelve dentro de unas 48 horas: \u201cS\u00e9 que pasamos por eso corriendo \u2014 \u00bfest\u00e1s bien? Hablemos.\u201d'},
  q:{en:'Why do you think waiting too long makes repair harder?',
     es:'\u00bfPor qu\u00e9 crees que esperar demasiado hace m\u00e1s dif\u00edcil la reparaci\u00f3n?'} },
{ t:{en:'A \u2014 Start with value, then the bridge', es:'A \u2014 Empieza con el valor, luego el puente'},
  b:{en:'This is the most-forgotten step \u2014 don\u2019t skip it. If you open with \u201cyou didn\u2019t turn in the data\u201d or \u201cyou showed up late,\u201d the other person\u2019s brain flips from thinking brain to emotional brain and <b>they stop hearing you completely.</b> So we start with the honest, specific value of the person or the relationship: \u201cI really appreciate you as a colleague, and I love when we share shifts together.\u201d Then comes <b>the bridge \u2014 the foundation of the whole resolution:</b> \u201cFor that reason, I want to share something that happened that made me feel upset / confused / not valued\u2026\u201d The value gives them safety; the bridge opens the door.',
     es:'Este es el paso que m\u00e1s se olvida \u2014 no lo saltes. Si abres con \u201cno entregaste los datos\u201d o \u201cllegaste tarde,\u201d el cerebro de la otra persona pasa del cerebro pensante al cerebro emocional y <b>deja de escucharte por completo.</b> Por eso empezamos con el valor honesto y espec\u00edfico de la persona o la relaci\u00f3n: \u201cTe aprecio mucho como colega, y me encanta cuando compartimos turnos.\u201d Luego viene <b>el puente \u2014 el fundamento de toda la resoluci\u00f3n:</b> \u201cPor esa raz\u00f3n, quiero compartir algo que pas\u00f3 que me hizo sentir molesta / confundida / no valorada\u2026\u201d El valor da seguridad; el puente abre la puerta.'},
  q:{en:'Think of a real working relationship. What is one honest sentence of value you could say out loud \u2014 followed by your bridge?',
     es:'Piensa en una relaci\u00f3n de trabajo real. \u00bfCu\u00e1l es una oraci\u00f3n honesta de valor que podr\u00edas decir en voz alta \u2014 seguida de tu puente?'} },
{ t:{en:'A \u2014 What happened, and YOUR impact', es:'A \u2014 Qu\u00e9 pas\u00f3, y TU impacto'},
  b:{en:'After the value and the bridge, say <b>what happened</b>: just the behavior, one sentence, no judgments. \u201cLast Tuesday you arrived an hour after our appointment without calling or texting me.\u201d Then say <b>how it impacted you</b> \u2014 and this part must be <b>your own real impact</b>: \u201cmy time,\u201d \u201cmy trust,\u201d \u201cI felt unheard.\u201d Never an assumed impact on someone else \u2014 don\u2019t say \u201cthe client lost trust in us\u201d unless the client actually said so. Stick to what is true for you; that is what makes it safe to hear.',
     es:'Despu\u00e9s del valor y el puente, di <b>qu\u00e9 pas\u00f3</b>: solo la conducta, una oraci\u00f3n, sin juicios. \u201cEl martes pasado llegaste una hora despu\u00e9s de nuestra cita sin llamarme ni escribirme.\u201d Luego di <b>c\u00f3mo te impact\u00f3</b> \u2014 y esta parte debe ser <b>tu propio impacto real</b>: \u201cmi tiempo,\u201d \u201cmi confianza,\u201d \u201cme sent\u00ed no escuchada.\u201d Nunca un impacto supuesto en otra persona \u2014 no digas \u201cel cliente perdi\u00f3 la confianza\u201d a menos que el cliente lo haya dicho. Qu\u00e9date con lo que es verdad para ti; eso es lo que lo hace seguro de escuchar.'},
  q:{en:'For your situation: name the behavior with no judgment, then your own real impact \u2014 two short sentences.',
     es:'Para tu situaci\u00f3n: nombra la conducta sin juicio, y luego tu propio impacto real \u2014 dos oraciones cortas.'} },
{ t:{en:'H \u2014 Then stop talking', es:'H \u2014 Luego deja de hablar'},
  b:{en:'You\u2019ve said your opening \u2014 now <b>pause.</b> When we\u2019re nervous, we want to say too much; the pause lets you listen, stay present, and let the other person respond. Two things can happen. <b>Bingo:</b> they apologize or own it \u2014 \u201cOh my gosh, I\u2019m sorry, I didn\u2019t realize\u201d \u2014 and you have resolution. That is the majority outcome: <b>most people resolve the conflict with just the opening and the pause.</b> Or: they get defensive. That\u2019s okay too \u2014 the next steps exist exactly for that small percentage, to seal the deal and tighten it up.',
     es:'Ya dijiste tu apertura \u2014 ahora <b>pausa.</b> Cuando estamos nerviosos, queremos decir demasiado; la pausa te deja escuchar, estar presente y dejar que la otra persona responda. Pueden pasar dos cosas. <b>Bingo:</b> se disculpa o lo reconoce \u2014 \u201cAy, perd\u00f3n, no me di cuenta\u201d \u2014 y hay resoluci\u00f3n. Ese es el resultado de la mayor\u00eda: <b>la mayor\u00eda resuelve el conflicto solo con la apertura y la pausa.</b> O: se pone a la defensiva. Tambi\u00e9n est\u00e1 bien \u2014 los siguientes pasos existen justo para ese peque\u00f1o porcentaje, para sellar el acuerdo y reforzarlo.'},
  q:{en:'What will you do if they own it \u2014 and what will you do if they get defensive or go quiet?',
     es:'\u00bfQu\u00e9 har\u00e1s si lo reconocen \u2014 y qu\u00e9 har\u00e1s si se ponen a la defensiva o se quedan en silencio?'} },
{ t:{en:'O & R \u2014 Open the door, then ask', es:'O y R \u2014 Abre la puerta, luego pide'},
  b:{en:'If they got defensive, you have two tools. <b>Open Possibilities</b> is an invitation \u2014 not necessarily a question \u2014 that paints what resolving could make possible and hands them the choice: \u201cI think it would be really good for us and for our clients if we resolve this \u2014 what do you think?\u201d If they choose no, that is their own choosing; you planted a seed they may come back to. <b>Request Repair</b> is more explicit: \u201cWe can\u2019t be at work like this \u2014 it\u2019s in our values to be collaborative. We\u2019ve got to resolve it.\u201d Know this: once someone is defensive, they often stay defensive \u2014 and you are still doing it right. You are giving chance after chance and <b>staying in integrity.</b>',
     es:'Si se pusieron a la defensiva, tienes dos herramientas. <b>Abrir Posibilidades</b> es una invitaci\u00f3n \u2014 no necesariamente una pregunta \u2014 que pinta lo que resolver har\u00eda posible y les deja la decisi\u00f3n: \u201cCreo que ser\u00eda muy bueno para nosotros y para nuestros clientes resolver esto \u2014 \u00bft\u00fa qu\u00e9 piensas?\u201d Si eligen que no, es su propia elecci\u00f3n; plantaste una semilla a la que pueden volver. <b>Pedir Reparaci\u00f3n</b> es m\u00e1s expl\u00edcito: \u201cNo podemos estar as\u00ed en el trabajo \u2014 est\u00e1 en nuestros valores ser colaborativos. Tenemos que resolverlo.\u201d Debes saber: cuando alguien est\u00e1 a la defensiva, suele seguir a la defensiva \u2014 y a\u00fan as\u00ed lo est\u00e1s haciendo bien. Est\u00e1s dando oportunidad tras oportunidad y <b>manteni\u00e9ndote en integridad.</b>'},
  q:{en:'Write your own open-possibilities line \u2014 one sentence that paints what repair could make possible and leaves them the choice.',
     es:'Escribe tu propia l\u00ednea de abrir posibilidades \u2014 una oraci\u00f3n que pinte lo que la reparaci\u00f3n har\u00eda posible y les deje la decisi\u00f3n.'} },
{ t:{en:'A \u2014 Act & Align: seal the deal', es:'A \u2014 Actuar y Alinear: sella el acuerdo'},
  b:{en:'<b>Always close here \u2014 even after a quick apology.</b> Ask for the specific future behavior: \u201cGoing forward, if you\u2019re running late, can you please text me ahead of time?\u201d It may sound obvious, but it is not \u2014 sometimes we have to name it. People are often genuinely unaware (a chronic interrupter is rarely told). Naming it seals the deal so it doesn\u2019t happen again. And if after everything there is no repair: <b>escalate, don\u2019t retreat.</b> Go to your manager from integrity: \u201cI shared their value, what happened, and how it impacted me. I asked for repair, and they didn\u2019t want it. I tried my best \u2014 I need help.\u201d Done well, all five steps can take under 30 seconds.',
     es:'<b>Cierra siempre aqu\u00ed \u2014 incluso despu\u00e9s de una disculpa r\u00e1pida.</b> Pide la conducta futura espec\u00edfica: \u201cDe ahora en adelante, si vas tarde, \u00bfme puedes mandar un mensaje antes?\u201d Puede sonar obvio, pero no lo es \u2014 a veces hay que nombrarlo. Las personas muchas veces no se dan cuenta (a quien interrumpe casi nunca se lo dicen). Nombrarlo sella el acuerdo para que no vuelva a pasar. Y si despu\u00e9s de todo no hay reparaci\u00f3n: <b>escala, no te retires.</b> Ve con tu gerente desde la integridad: \u201cCompart\u00ed su valor, lo que pas\u00f3 y c\u00f3mo me impact\u00f3. Ped\u00ed reparaci\u00f3n y no la quiso. Hice mi mejor esfuerzo \u2014 necesito ayuda.\u201d Bien hecho, los cinco pasos pueden tomar menos de 30 segundos.'},
  q:{en:'What is your closing agreement line for a conflict you might actually face?',
     es:'\u00bfCu\u00e1l es tu frase de acuerdo para cerrar, en un conflicto que podr\u00edas enfrentar de verdad?'} }
];

let trState = { idx:0, phase:'read', stopped:false, busy:false };

function trainingSystem(lesson) {
  return OVERRIDE + `

You are Dr. Isa's warm voice in the AHORA training companion (AHORA Framework by Dr. Isa Karabed, DSW). The learner is a PARTICIPANT taking the AHORA conflict resolution training. They just finished the lesson "${lesson.t.en}" and answered this reflection question: "${lesson.q.en}"
Respond in EXACTLY 2-3 short sentences: warmly affirm something specific and real in their answer, connect it to the lesson's core idea in plain language, and if their answer misses the heart of the lesson (e.g. value missing, bridge missing, assumed impact on someone else, goal of being right instead of repair), offer ONE gentle redirect. Never shame, never lecture, never ask a question back. Plain, warm, keep-it-real voice.

` + PRINCIPLES + `

` + langLine();
}

function renderTraining() {
  const u = UI[lang], body = $('training-body');
  body.innerHTML = '';
  if (trState.idx >= TRAINING.length) { renderTrainingDone(); return; }
  const L = TRAINING[trState.idx];
  const c = document.createElement('div'); c.className = 'fc-counter';
  c.textContent = u.trCounter + ' ' + (trState.idx+1) + ' / ' + TRAINING.length; body.appendChild(c);
  const title = document.createElement('div'); title.className = 'ref-title'; title.style.marginBottom = '10px';
  title.textContent = L.t[lang]; body.appendChild(title);
  const text = document.createElement('div'); text.className = 'ref-text'; text.style.marginBottom = '18px';
  text.innerHTML = L.b[lang]; body.appendChild(text);
  const lbl = document.createElement('div'); lbl.className = 'pr-step-lbl'; lbl.textContent = u.trReflect; body.appendChild(lbl);
  const q = document.createElement('div'); q.className = 'pr-q'; q.textContent = L.q[lang]; body.appendChild(q);
  const box = document.createElement('textarea'); box.className = 'pr-box'; box.id = 'tr-box'; box.placeholder = u.trPh; body.appendChild(box);
  const btns = document.createElement('div'); btns.className = 'pr-btns';
  const send = document.createElement('button'); send.className = 'gold-btn'; send.id = 'tr-send'; send.textContent = u.trSend;
  send.onclick = trShare; btns.appendChild(send);
  const skip = document.createElement('button'); skip.className = 'ghost-btn'; skip.textContent = u.trSkip;
  skip.onclick = trAdvance; btns.appendChild(skip);
  body.appendChild(btns);
  const fb = document.createElement('div'); fb.className = 'pr-fb'; fb.id = 'tr-fb'; body.appendChild(fb);
  const hs = document.createElement('div'); hs.className = 'pr-hardstop'; hs.id = 'tr-hs'; body.appendChild(hs);
  const nav = document.createElement('div'); nav.className = 'pr-nav';
  const nxt = document.createElement('button'); nxt.className = 'gold-btn'; nxt.id = 'tr-next'; nxt.style.marginTop = '0';
  nxt.style.display = 'none'; nxt.textContent = u.trNext; nxt.onclick = trAdvance; nav.appendChild(nxt);
  body.appendChild(nav);
  body.scrollTop = 0;
}

async function trShare() {
  if (trState.busy || trState.stopped) return;
  const txt = $('tr-box').value.trim(); if (!txt) return;
  if (isBlocked(txt)) {
    trState.stopped = true;
    const hs = $('tr-hs'); hs.classList.add('show');
    hs.innerHTML = '<div class="hardstop-card" style="max-width:100%">' + escapeHTML(HARDSTOP[lang]) + '</div>';
    $('tr-box').disabled = true; $('tr-send').disabled = true;
    return;
  }
  trState.busy = true; $('tr-send').disabled = true;
  const fb = $('tr-fb'); fb.classList.add('show'); fb.textContent = '\u2026';
  try {
    const raw = await callAPI(trainingSystem(TRAINING[trState.idx]), [{role:'user', content:txt}]);
    fb.textContent = raw.trim();
  } catch(e) { fb.textContent = UI[lang].err; }
  trState.busy = false;
  $('tr-next').style.display = 'block';
}

function trAdvance() {
  if (trState.stopped) return;
  trState.idx++; trState.busy = false;
  renderTraining();
}

function renderTrainingDone() {
  const u = UI[lang], body = $('training-body');
  body.innerHTML = '';
  const card = document.createElement('div'); card.className = 'script-card'; card.style.maxWidth = '100%';
  card.innerHTML = '<div class="script-lbl">' + u.trDoneBig + '</div>'
    + '<div class="ref-text">' + u.trDone + '</div>';
  body.appendChild(card);
  const nav = document.createElement('div'); nav.className = 'pr-nav'; nav.style.flexDirection = 'column'; nav.style.gap = '8px';
  const go = document.createElement('button'); go.className = 'gold-btn'; go.style.marginTop = '0';
  go.textContent = u.trGoPractice; go.onclick = () => openMode('practice'); nav.appendChild(go);
  const again = document.createElement('button'); again.className = 'ghost-btn';
  again.textContent = u.trRestart; again.onclick = () => { trState = { idx:0, phase:'read', stopped:false, busy:false }; renderTraining(); };
  nav.appendChild(again);
  body.appendChild(nav);
}

/* =============== CURRICULUM REFRESHER =============== */
let refIdx = 0;
function renderRef() {
  const u = UI[lang], s = SLIDES[refIdx];
  $('ref-counter').textContent = u.slide + ' ' + (refIdx+1) + ' / ' + SLIDES.length;
  const k = typeof s.k === 'string' ? s.k : s.k[lang];
  $('ref-card').innerHTML = '<div class="ref-letter">' + k + '</div>'
    + '<div class="ref-title">' + s.t[lang] + '</div>'
    + '<div class="ref-text">' + s.b[lang] + '</div>';
  $('ref-prev').disabled = refIdx === 0;
  $('ref-prev').style.opacity = refIdx === 0 ? .4 : 1;
  $('ref-next').textContent = refIdx === SLIDES.length-1 ? u.rDone : u.rNext;
  $('ref-card').scrollTop = 0;
}
function refMove(d) {
  if (refIdx === SLIDES.length-1 && d === 1) refIdx = 0; else refIdx = Math.max(0, Math.min(SLIDES.length-1, refIdx + d));
  renderRef();
}
document.addEventListener('keydown', e => {
  if (currentScreen === 'refresher') {
    if (e.key === 'ArrowRight') refMove(1);
    if (e.key === 'ArrowLeft') refMove(-1);
  }
});

$('gate-input').addEventListener('keydown', e => { if (e.key==='Enter') checkCode(); });
